<!DOCTYPE html>
<html lang="{{ lang | default(value=config.default_language) }}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ config.description }}{% endblock %}" />
<link rel="stylesheet" href="{{ get_url(path='pagefind/pagefind-ui.css') | safe }}" />
<link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) | safe }}" />
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script>
  (function(){
    try {
      var stored = localStorage.getItem('theme');
      var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      if (localStorage.getItem('sidebar') === 'collapsed') {
        document.documentElement.dataset.sidebar = 'collapsed';
      }
    } catch(e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
{% block head_extra %}{% endblock %}
</head>
<body>
<button class="sidebar-reopen icon-btn" data-sidebar-toggle aria-label="Open sidebar">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
</button>
<div class="layout">
  <header class="topbar">
    <a class="brand" href="{{ get_url(path='/') | safe }}">{{ config.title }}</a>
    <div class="topbar-spacer"></div>
    {% include "partials/theme-toggle.html" %}
  </header>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a class="brand brand-sidebar" href="{{ get_url(path='/') | safe }}">{{ config.title }}</a>
      <button class="icon-btn" data-sidebar-toggle aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
    </div>
    {% include "partials/search.html" %}
    <nav class="sidebar-nav">
      {% include "partials/sidebar.html" %}
    </nav>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <aside class="toc">
    {% block toc %}{% endblock %}
  </aside>
</div>

<script src="{{ get_url(path='pagefind/pagefind-ui.js') | safe }}"></script>
<script src="{{ get_url(path='js/theme.js') | safe }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
