{% if href is starting_with("http") %}{% set link = href %}{% else %}{% set link = get_url(path=href) %}{% endif %}
<a class="card" href="{{ link | safe }}">
  <div class="card-body">
    <div class="card-title">
      <span>{{ title }}</span>
      <svg class="card-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    {% if description %}<p class="card-desc">{{ description }}</p>{% endif %}
  </div>
</a>
